customHeaders:
  - pattern: '**'
    headers:
      - key: Cache-Control
        value: 'no-cache, max-age=0, must-revalidate'
  - pattern: '/assets/**'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  - pattern: '/release.json'
    headers:
      - key: Cache-Control
        value: 'no-store'
